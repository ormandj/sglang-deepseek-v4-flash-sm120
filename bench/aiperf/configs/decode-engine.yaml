# yaml-language-server: $schema=https://raw.githubusercontent.com/ai-dynamo/aiperf/6ed4823d127b3a6d12c63fb8c2ca5eff13f9ba23/src/aiperf/config/schema/aiperf-config.schema.json
schemaVersion: "2.0"

randomSeed: ${AIPERF_RANDOM_SEED:2026081201}

benchmark:
  model: ${MODEL_NAME:deepseek-v4-flash}

  endpoint:
    url: ${INFERENCE_URL:http://127.0.0.1:8000}
    type: chat
    api_key: ${BENCH_API_KEY:}
    streaming: true
    timeout: ${REQUEST_TIMEOUT_SECONDS:600}
    useServerTokenCount: true
    waitForModelTimeout: 300
    waitForModelMode: both
    extra:
      temperature: 0.0
      top_p: 1.0
      seed: ${SAMPLING_SEED:2026081201}
      ignore_eos: true
      min_tokens: ${DECODE_OSL:4096}

  tokenizer:
    name: ${TOKENIZER_PATH:/models/deepseek-ai/DeepSeek-V4-Flash-0731}
    trustRemoteCode: true
    applyChatTemplate: true

  dataset:
    type: synthetic
    entries: ${DECODE_CONCURRENCY:1}
    sampling: sequential
    prompts:
      corpus: coding
      isl: ${DECODE_ISL:16384}
      osl: ${DECODE_OSL:4096}

  phases:
    - name: profiling
      type: concurrency
      requests: ${DECODE_CONCURRENCY:1}
      concurrency: ${DECODE_CONCURRENCY:1}

  runtime:
    ui: none
    workers: 1
    recordProcessors: 1
    statsInterval: 0

  gpuTelemetry:
    enabled: ${GPU_TELEMETRY_ENABLED:true}

  serverMetrics:
    enabled: true
    urls:
      - ${SERVER_METRICS_URL:http://127.0.0.1:8000/metrics}
    formats: [json, csv, parquet, jsonl]
    discovery:
      mode: disabled

  artifacts:
    dir: ${ARTIFACT_DIR:./artifacts/decode-engine}
    summary: [json]
    records: [jsonl]
    raw: false
    trace: false
    sliceDuration: 1
    autoPlot: false
